<svg xmlns="http://www.w3.org/2000/svg" viewBox="-20 -20 1120 340" role="img" aria-label="Schéma de la Suite Atelier : les fichiers passent par Convert vers Tab, Tab alimente Projets et Viz, Nexus orchestre l'ensemble">
        <rect x="-20" y="-20" width="1120" height="340" rx="18" fill="#0f2038"/><defs>
          <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#6B7583"/></marker>
        </defs>
        <g font-family="Inter, sans-serif" font-size="14" fill="#E8ECF1">
          <!-- source -->
          <rect x="10" y="110" width="140" height="64" rx="12" fill="#0a1628" stroke="#2a4d7a"/>
          <text x="80" y="138" text-anchor="middle" font-weight="600">Vos fichiers</text>
          <text x="80" y="158" text-anchor="middle" fill="#9AA4B2" font-size="12">PDF · CSV · Excel</text>
          <!-- convert -->
          <rect x="210" y="110" width="150" height="64" rx="12" fill="#0a1628" stroke="#C9951D"/>
          <text x="285" y="138" text-anchor="middle" font-weight="600">Convert</text>
          <text x="285" y="158" text-anchor="middle" fill="#9AA4B2" font-size="12">lecture et nettoyage</text>
          <!-- tab -->
          <rect x="420" y="110" width="150" height="64" rx="12" fill="#0a1628" stroke="#21A366"/>
          <text x="495" y="138" text-anchor="middle" font-weight="600">Tab</text>
          <text x="495" y="158" text-anchor="middle" fill="#9AA4B2" font-size="12">tables et formules</text>
          <!-- projets / viz -->
          <rect x="640" y="40" width="160" height="64" rx="12" fill="#0a1628" stroke="#94D82D"/>
          <text x="720" y="68" text-anchor="middle" font-weight="600">Projets</text>
          <text x="720" y="88" text-anchor="middle" fill="#9AA4B2" font-size="12">planning et suivi</text>
          <rect x="640" y="180" width="160" height="64" rx="12" fill="#0a1628" stroke="#F2C811"/>
          <text x="720" y="208" text-anchor="middle" font-weight="600">Viz</text>
          <text x="720" y="228" text-anchor="middle" fill="#9AA4B2" font-size="12">rapports et KPI</text>
          <!-- nexus -->
          <rect x="880" y="96" width="190" height="92" rx="14" fill="#1d1a1f" stroke="#E8590C" stroke-width="1.5"/>
          <text x="975" y="132" text-anchor="middle" font-weight="700" font-size="16">Nexus</text>
          <text x="975" y="152" text-anchor="middle" fill="#9AA4B2" font-size="12">agents + orchestrateur</text>
          <text x="975" y="170" text-anchor="middle" fill="#9AA4B2" font-size="12">validation humaine</text>
          <!-- trésorerie / cuisine -->
          <rect x="880" y="236" width="90" height="44" rx="10" fill="#0a1628" stroke="#5B7BFF"/>
          <text x="925" y="263" text-anchor="middle" font-size="12.5">Trésorerie</text>
          <rect x="980" y="236" width="90" height="44" rx="10" fill="#0a1628" stroke="#E056E2"/>
          <text x="1025" y="263" text-anchor="middle" font-size="12.5">Cuisine</text>
        </g>
        <g stroke="#6B7583" stroke-width="1.5" fill="none" marker-end="url(#ar)">
          <path d="M150,142 H206"/>
          <path d="M360,142 H416"/>
          <path d="M570,130 C605,130 605,72 636,72"/>
          <path d="M570,154 C605,154 605,212 636,212"/>
        </g>
        <g stroke="#E8590C" stroke-width="1.3" stroke-dasharray="5 5" fill="none" opacity=".85">
          <path d="M880,120 C840,120 840,72 800,72"/>
          <path d="M880,164 C840,164 840,212 800,212"/>
          <path d="M1010,96 V18 H495 V106"/>
          <path d="M925,188 V236"/>
          <path d="M1025,188 V236"/>
        </g>
        <g font-family="JetBrains Mono, monospace" font-size="11" fill="#6B7583">
          <text x="10" y="292">orchestration des agents ⟶ lecture, analyse, actions validées</text>
        </g>
      </svg>